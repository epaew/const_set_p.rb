name: RuboCop

on:
  pull_request: {}
  push:
    branches:
      - master

jobs:
  build:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true

      - run: bundle exec rubocop
