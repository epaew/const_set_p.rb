name: Steep

on:
  pull_request: {}
  push:
    branches:
      - master

jobs:
  build:
    name: Steep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
          bundler-cache: true

      - run: bundle exec steep check
